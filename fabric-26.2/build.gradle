plugins {
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
    id 'maven-publish'
}

version = rootProject.fabric_mod_version
group = rootProject.mod_group_id
base.archivesName = 'MineToMesh-fabric-26.2'

loom {
    splitEnvironmentSourceSets()

    mods {
        minetomesh {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        serverSmoke {
            server()
            name 'Fabric Server Smoke'
            runDir 'run/serverSmoke'
            vmArg '-Dminetomesh.serverSmoke=true'
            programArg '--nogui'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.fabric_minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    implementation project(':common')
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    dependsOn tasks.named('jar')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
    from(project(':neoforge-1.21.1').file('src/main/resources')) {
        include 'assets/minetomesh/lang/**'
        include 'assets/minetomesh/textures/**'
        include 'minetomesh_logo.png'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.named('runServerSmoke').configure {
    doFirst {
        file('run/serverSmoke').mkdirs()
        file('run/serverSmoke/eula.txt').text = 'eula=true\n'
        file('run/serverSmoke/server.properties').text =
                'server-port=0\nonline-mode=false\n'
    }
}

tasks.register('fabricServerSmoke') {
    group = 'verification'
    description = 'Starts Fabric 26.2 dedicated server and stops after initialization.'
    dependsOn tasks.named('runServerSmoke')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('jar', Jar).configure {
    archiveFileName = "MineToMesh-${version}+mc26.2.jar"
    from(project(':common').sourceSets.main.output)
    from(rootProject.file('LICENSE')) {
        rename { "LICENSE_MineToMesh" }
    }
}
